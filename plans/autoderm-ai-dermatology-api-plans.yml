specification: API Commons Plans
specificationVersion: '0.1'
provider: Autoderm
providerId: autoderm-ai-dermatology-api
generated: '2026-08-09'
method: searched
created: '2026-08-09'
modified: '2026-08-09'
tags:
  - Medical Imaging
  - AI Inference
  - Dermatology
description: >-
  Three published tiers, priced per DETECTION rather than per API request. A
  free trial gives five one-time detections with no card. Basic is a flat $100
  per month for 100 detections with $1.00 per-call overage — an unusually high
  unit price that reflects the regulated-medical-device nature of the output
  rather than the compute cost. Enterprise is custom.
sources:
  - https://autoderm.ai/pricing/
currency: USD
plans:
  - id: autoderm-trial
    name: Trial
    type: free
    price: 0
    description: 5 one-time detections. No credit card required.
    entries:
      - label: Detections
        name: detections
        type: quota
        metric: detections
        limit: 5
        timeFrame: one-time
    features:
      - Disease detection & skin analysis API
      - Usage dashboard
      - Docs & community support
      - API key management
      - Full analytics exports
    sign_up: https://app.autoderm.ai/en/auth/sign-up
  - id: autoderm-basic
    name: Basic
    type: subscription
    price: 100
    timeFrame: month
    description: $100 per month for 100 detections, then $1.00 per call.
    entries:
      - label: Included detections
        name: detections_included
        type: quota
        metric: detections
        limit: 100
        timeFrame: month
      - label: Additional detection
        name: detection_overage
        type: metered
        metric: detection
        price: 1.00
        limit: -1
        timeFrame: usage
    features:
      - Everything in Trial
      - Unlimited API keys with role-based access
      - Full analytics and usage reports
      - Automatic Stripe invoicing from $500 usage
      - Standard email support (1 business day)
      - Reseller & customer portal rights
      - Dedicated success manager
    sla: 99.5% uptime commitment (see lifecycle/)
  - id: autoderm-enterprise
    name: Enterprise
    type: custom
    price: null
    description: Unlimited API volume, custom pricing.
    entries:
      - label: Detections
        name: detections
        type: quota
        metric: detections
        limit: -1
        timeFrame: month
    features:
      - Everything in Basic
      - Unlimited API volume
      - Priority support & custom SLAs
      - Onboarding & integration assistance
      - Custom contract & invoicing terms
    contact: https://calendly.com/autoderm/demo
    sla: 99.5% uptime commitment with faster support response targets (see lifecycle/)
billing:
  processor: Stripe
  automatic_invoicing_threshold: $500 monthly usage
notes:
  - >-
    "Most platforms complete integration in approximately 3 hours" — Autoderm's
    own published integration-effort claim.
  - >-
    The SLA applies only to Basic and Enterprise customers; Trial usage carries
    no uptime commitment.
