name: Autoderm – AI Dermatology API
description: >-
  Autoderm is a white-label REST API for AI-assisted analysis of dermatological images, operated as a
  regulated medical device. A client POSTs a single skin photograph as multipart/form-data and receives
  the top five most probable conditions, each with a confidence score between 0 and 1, an ICD-10 code
  and an English name; a companion static catalog maps every ICD-10 code to localized and layman's
  names plus read-more links in seven languages. Alongside disease detection the API exposes Fitzpatrick
  skin-type classification, a blur/image-quality screen, a genitalia content-safety classifier, an age
  estimator, and — unusually — the regulatory device label itself as a live anonymous endpoint.
  Autoderm is CE-marked under EU MDD 93/42/EEC as a legacy Class I device, is transitioning to MDR
  Class IIa under EU MDR 2017/745, and holds FDA Breakthrough Device Designation. It is sold into
  telemedicine, pharmacy, and digital health platforms as a decision-support and triage tool, and is
  explicitly not intended as a means of diagnosis.
